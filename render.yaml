services:
  - type: web
    name: examcraft-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: examcraft-data
      mountPath: /app/data
      sizeGB: 1
